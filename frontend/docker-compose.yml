version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile  # Use the dev Dockerfile
    ports:
      - "5173:5173"  # Map host 5173 → container 5173
    volumes:
      - .:/app  # Live code reload (bind mount)
      - /app/node_modules  # Prevent overwriting node_modules
    environment:
      - NODE_ENV=development
    networks:
      - app-network

networks:
  app-network:
    driver: bridge