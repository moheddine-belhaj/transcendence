  kibana:
    depends_on:
      es01:
        condition: service_healthy
      # es02:
      #   condition: service_healthy
      # es03:
      #   condition: service_healthy
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    volumes:
      - ./certs:/usr/share/kibana/config/certs
      - kibanadata:/usr/share/kibana/data
    ports:
      - ${KIBANA_PORT}:5601
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
    mem_limit: ${KB_MEM_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
  
  logstash:
    depends_on:
      es01:
        condition: service_healthy
      kibana:
        condition: service_healthy
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION}
    container_name: logstash
    user: root
    volumes:
      - ./certs:/usr/share/logstash/certs
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./logfile.log:/logfile.log:ro
    environment:
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_USER=${ELASTIC_USER}

    command: >
      bash -c "
        # Install plugin if missing (silent check)
        if ! logstash-plugin list --quiet | grep -q logstash-output-prometheus; then
          echo 'Installing Prometheus plugin...';
          logstash-plugin install logstash-output-prometheus;
        fi;
        # Start Logstash with your original command
        exec logstash -f /usr/share/logstash/pipeline/logstash.conf --config.reload.automatic --log.level=debug
      "
    ports:
      - "9600:9600"


## added prom from here
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/data:/var/lib/grafana
    restart: unless-stopped


  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    ports:
      - "9115:9115"
    volumes:
    - ./blackbox.yml:/config/blackbox.yml:ro
    command:
    - '--config.file=/config/blackbox.yml'
    restart: unless-stopped


  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - 9100:9100

      
  ilm-init:
    image: curlimages/curl:latest
    container_name: ilm-init
    user: root
    depends_on:
      es01:
        condition: service_healthy
    volumes:
      - ./setup-ilm.sh:/setup-ilm.sh:ro
      - ./certs:/config/certs:ro
    entrypoint: "sh /setup-ilm.sh"
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_USER=${ELASTIC_USER}
      - CA_CERT=/config/certs/ca/ca.crt
      - ES_HOST=https://es01:9200



volumes:
  certs:
    driver: local
  esdata01:
    driver: local
  # esdata02:
  #   driver: local
  # esdata03:
  #   driver: local
  kibanadata:
    driver: local
  logstashdata01:
   driver: local
