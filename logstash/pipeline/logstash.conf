input {
  file {
    path => "/logfile.log"   # Replace with your actual log file path
    start_position => "beginning"
    sincedb_path => "/dev/null"            # So it reads from beginning every time (for testing)
  }
}

filter {
  # grok {
  #   match => { "message" => "your pattern" }
  # }
}

output {
  elasticsearch {
    hosts => ["https://es01:9200"]
    # If your Elasticsearch uses self-signed certs or custom CA, add:
    ssl => true
    cacert => "/usr/share/logstash/certs/ca/ca.crt"   # CA cert file inside Logstash container
    # If Elasticsearch requires username/password (basic auth), add:
    user => "elastic"
    password => "elastic123"
    index => "your-index-name-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}